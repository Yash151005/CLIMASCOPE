services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: climascope
      POSTGRES_USER: climascope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climascope_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climascope -d climascope"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://climascope:${POSTGRES_PASSWORD:-climascope_local}@db:5432/climascope
      ENVIRONMENT: production
      DEBUG: "false"
      BACKEND_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
